<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>QZRS-webdav-backup 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 16.5l4 4 10-9' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-spinner" aria-hidden="true"></div>
  <p>正在载入控制台…</p>
</div>
<div id="app" hidden></div>
<div id="modal-root"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<noscript>
  <p style="padding:24px;font-family:sans-serif">控制台需要启用 JavaScript。</p>
</noscript>
<script>
/*
 * 启动兜底。故意只用 ES5 语法（var / function / 字符串拼接），不用箭头函数、
 * 可选链、模板字符串等 —— 因为要修的正是「浏览器太旧、app.js 解析失败」这种情况。
 *
 * 背景：index.html 用 <script src>（经典脚本，非 module）加载 app.js。只要 app.js
 * 里有浏览器不支持的语法，整个文件不会被解析执行，页面就永远停在「正在载入控制台…」，
 * 而且看不到任何原因。这段脚本能在那种情况下把原因和重试入口显示出来。
 */
(function () {
  var shown = false;
  function fail(msg) {
    if (shown || window.__wdbBooted) { return; }
    shown = true;
    var el = document.getElementById('boot');
    if (!el) { return; }
    el.innerHTML =
      '<div style="max-width:560px;text-align:left;line-height:1.7">'
      + '<p style="font-weight:600;margin:0 0 8px;font-size:16px">控制台脚本未能启动</p>'
      + '<p style="margin:0 0 12px;color:#b42318">' + msg + '</p>'
      + '<p style="margin:0 0 6px">请依次尝试：</p>'
      + '<ol style="margin:0 0 14px;padding-left:22px">'
      + '<li>强制刷新：Windows 按 <b>Ctrl+F5</b>，Mac 按 <b>Cmd+Shift+R</b></li>'
      + '<li>换用较新的浏览器（Chrome / Edge / Firefox 近两年的版本）</li>'
      + '<li>按 <b>F12</b> 打开开发者工具，看 Console 里的报错</li>'
      + '</ol>'
      + '<button onclick="location.reload()" style="padding:8px 18px;border-radius:6px;'
      + 'border:1px solid #d0d5dd;background:#fff;cursor:pointer;font-size:14px">重新加载</button>'
      + '</div>';
  }
  // 资源加载失败（app.js / style.css 拿不到、或 MIME 被拒）
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName === 'SCRIPT') {
      fail('脚本加载失败：' + (e.target.src || '(未知路径)'));
    }
  }, true);
  // 运行时与语法错误（语法错误也在同源脚本上触发 window error）
  window.addEventListener('error', function (e) {
    if (e && e.message) { fail('脚本报错：' + e.message); }
  });
  setTimeout(function () {
    fail('脚本在 8 秒内没有完成初始化：可能是浏览器版本过旧，或与服务的连接被中断。');
  }, 8000);
})();
</script>
<script src="/app.js"></script>
</body>
</html>
